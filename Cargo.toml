[package]
name = "skillscope"
version = "2.0.2"
edition = "2024"
rust-version = "1.90"
license = "MIT"
description = "Local skill audit, usage analytics, health checks, and HTML dashboard for Claude Code and Codex skills."
repository = "https://github.com/bahayonghang/skillscope"

[[bin]]
name = "skillscope"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aho-corasick = "1"
clap = { version = "4.5", features = ["derive", "env"] }
dirs = "6"
jiff = { version = "0.2", features = ["serde"] }
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
